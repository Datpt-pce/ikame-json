<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iKame onboarding Lottie preview</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #e9edf2; color: #18202a; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      section { display: grid; gap: 12px; justify-items: center; }
      #animation { height: min(82vh, 820px); aspect-ratio: var(--aspect); background: white; overflow: hidden; box-shadow: 0 16px 48px #1c2b3a26; }
      #status { margin: 0; font-size: 14px; color: #52606d; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
  </head>
  <body>
    <main>
      <section>
        <div id="animation" aria-label="Lottie preview"></div>
        <p id="status">Loading…</p>
      </section>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const allowed = new Set(["welcome-1.json", "on-1.json", "on-2.json", "on-3.json"]);
      const file = allowed.has(params.get("file")) ? params.get("file") : "welcome-1.json";
      const frame = Math.max(0, Number(params.get("frame") || 0));
      const container = document.querySelector("#animation");
      const status = document.querySelector("#status");
      const animation = lottie.loadAnimation({
        container,
        renderer: "svg",
        loop: false,
        autoplay: false,
        path: `dist/${file}`,
        rendererSettings: { progressiveLoad: false, preserveAspectRatio: "xMidYMid meet" },
      });
      animation.addEventListener("DOMLoaded", () => {
        container.style.setProperty("--aspect", `${animation.animationData.w} / ${animation.animationData.h}`);
        if (params.get("clean") === "1") {
          document.body.style.background = "transparent";
          document.querySelector("main").style.cssText = "display:block;min-height:0;padding:0";
          document.querySelector("section").style.display = "block";
          container.style.cssText = `width:${animation.animationData.w}px;height:${animation.animationData.h}px;overflow:hidden`;
          status.hidden = true;
        }
        animation.goToAndStop(frame, true);
        status.textContent = `${file} · frame ${frame} / ${animation.totalFrames}`;
        document.body.dataset.ready = "true";
        if (params.get("play") === "1") animation.play();
      });
      animation.addEventListener("data_failed", () => {
        status.textContent = `Failed to load ${file}`;
        document.body.dataset.ready = "failed";
      });
    </script>
  </body>
</html>
